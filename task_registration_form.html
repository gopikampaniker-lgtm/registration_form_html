<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTERATION FORM</title>
</head>
<body>
    <h1><CEnter>REGISTERATION FROM </CENter></h1>
    <form action="">
        <table>
            <tr>
                <th>First Name:</th>
                <td>
                    <input type="text" name="fname" placeholder="eg:Ashley" readonly minlength="3">
                </td>
            </tr>
             <tr>
                <th>
                    Lastname:
                </th>
                <td> <input type="text" name="lname" placeholder="eg:Hart" required minlength="3"></td>
            </tr>
             <tr>
                <th>
                    DOB:
                </th>
                <td> <input type="date" name="dob" ></td>
            </tr>

          <tr>
                <th>
                    Gender:
                </th>
                <td> <input type="radio" name="gender" value="male" required>Male 
                <input type="radio" name="gender" value="female" required> Female</td>

                
            </tr>   

             <tr>
                <th>
                    Qualification:
                </th>
                <td> <input type="text"></td>
            </tr>

            

             <tr>
                <th>
                Address:
                </th>
                <td> <textarea name="address" id="" rows="4" cols="30"></textarea></td>
            </tr>


             <tr>
                <th>
                State:
                </th>
                <td> <select name="" id="" required>
                    <option value="">Select State</option>
                    <option value="kerala">kerala</option>
                    <option value="tamilnadu">Tamilnadu</option>
                    <option value="karnataka">Karnataka</option>
                    <option value="goa">Goa</option>
                </select></td>
                    
            </tr>
             <tr>
                <th>
                    Pincode:
                </th>
                <td> <input type="text" name="pincode" pattern="[0-9]{6}" maxlength="6" required></td>

            </tr>

             <tr>
                <th>
                    Email:
                </th>
                <td> <input type="email" required></td>
            </tr>
             <tr>
                <th>
                    Phone:
                </th>
                <td> <input type="tel" name="phone" pattern="[0-9]{10}" maxlength="10" required></td>
            </tr>

             <tr>
                <th>
                 Username
                </th>
                <td> <input type="text" name="username" minlength="5" required></td>
            </tr>
             <tr>
                <th>
                 password
                </th>
                <td> <input type="password" minlength="8" required></td>
            </tr>
             <tr>
                
                <td  colspan="2" align="CEnter">
                    <button >Submit</button> </td>
            </tr>
        </table>
    </form>
</body>
</html>
